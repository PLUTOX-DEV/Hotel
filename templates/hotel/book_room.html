{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-3xl mx-auto mt-10 bg-white p-8 shadow-lg rounded-lg">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-700">Book Your Stay</h1>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <h2 class="text-xl font-semibold text-gray-700 border-b pb-2">Guest Information</h2>
            <div class="space-y-4">
                {{ guest_form.as_p }}
            </div>

            <h2 class="text-xl font-semibold text-gray-700 border-b pb-2">Booking Details</h2>
            <div class="space-y-4">
                {{ booking_form.as_p }}
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition duration-300">
                Confirm Booking
            </button>
        </form>
    </div>
</body>
</html>
