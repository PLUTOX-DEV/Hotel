{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold text-center mb-6">Book Your Room</h1>
        <form action="/submit-booking/" method="POST" class="bg-white p-6 rounded-lg shadow-md max-w-lg mx-auto">
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="name" name="name" class="mt-1 p-2 w-full border rounded-md" required>
            </div>
            
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" class="mt-1 p-2 w-full border rounded-md" required>
            </div>
            
            <div class="mb-4">
                <label for="checkin" class="block text-sm font-medium text-gray-700">Check-in Date</label>
                <input type="date" id="checkin" name="checkin" class="mt-1 p-2 w-full border rounded-md" required>
            </div>
            
            <div class="mb-4">
                <label for="checkout" class="block text-sm font-medium text-gray-700">Check-out Date</label>
                <input type="date" id="checkout" name="checkout" class="mt-1 p-2 w-full border rounded-md" required>
            </div>
            
            <div class="mb-4">
                <label for="room" class="block text-sm font-medium text-gray-700">Room Type</label>
                <select id="room" name="room" class="mt-1 p-2 w-full border rounded-md">
                    <option value="single">Single Room</option>
                    <option value="double">Double Room</option>
                    <option value="suite">Suite</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label for="guests" class="block text-sm font-medium text-gray-700">Number of Guests</label>
                <input type="number" id="guests" name="guests" class="mt-1 p-2 w-full border rounded-md" min="1" required>
            </div>
            
            <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600">Book Now</button>
        </form>
    </div>
</body>
</html>
